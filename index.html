<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
       
        
        <div class="form-header">
            <h1>Contact Information</h1>
            <p>Please fill out the form below with your contact details</p>
        </div>
        
        <form class="contact-form" action="confirmation.html" method="GET">
            <!-- Personal Information Box -->
            <div class="section-box">
                <h2 class="section-title">Personal Information</h2>
                
                <div class="form-group">
                    <label for="fullName">Full Name <span class="required">*</span></label>
                    <input type="text" id="fullName" name="fullName" required pattern="[A-Za-z ]{2,50}" title="Please enter a valid name (2-50 characters, letters only)">
                </div>
                
                <div class="form-group">
                    <label for="phone">Contact Number <span class="required">*</span></label>
                    <input type="tel" id="phone" name="phone" required pattern="[0-9]{10}" title="Please enter a valid 10-digit phone number">
                </div>
                
                <div class="form-group">
                    <label>Gender <span class="required">*</span></label>
                    <div class="radio-group">
                        <label class="radio-label">
                            <input type="radio" name="gender" value="male" required>
                            Male
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="gender" value="female">
                            Female
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="gender" value="prefer-not-to-say">
                            Prefer not to say
                        </label>
                    </div>
                </div>
            </div>
            
            <!-- Company Information Box -->
            <div class="section-box">
                <h2 class="section-title">Company Information</h2>
                
                <div class="form-group">
                    <label for="company">Company Name <span class="required">*</span></label>
                    <input type="text" id="company" name="company" required minlength="2" maxlength="50" title="Company name must be between 2 and 50 characters">
                </div>
                
                <div class="form-group">
                    <label for="email">Email Address <span class="required">*</span></label>
                    <input type="email" id="email" name="email" required title="Please enter a valid email address">
                </div>
                
                <div class="form-group">
                    <label for="department">Department <span class="required">*</span></label>
                    <select id="department" name="department" required>
                        <option value="">Select Department</option>
                        <option value="hr">HR</option>
                        <option value="sales">Sales</option>
                        <option value="development">Development</option>
                        <option value="marketing">Marketing</option>
                        <option value="others">Others</option>
                    </select>
                </div>
            </div>
            
            <!-- Address Information Box -->
            <div class="section-box">
                <h2 class="section-title">Address Information</h2>
                
                <div class="form-group">
                    <label for="address">Address <span class="required">*</span></label>
                    <textarea id="address" name="address" rows="3" required minlength="10" maxlength="200" title="Address must be between 10 and 200 characters"></textarea>
                </div>
            </div>
            
            <div class="submit-section">
                <button type="submit" class="submit-btn">Submit</button>
            </div>
        </form>
    </div>
</body>
</html>
